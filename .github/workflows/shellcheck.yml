# Bash toolkit: syntax + ShellCheck at warning level (badge in README).
name: shellcheck

on:
  push:
    branches: [main]
    paths: ["**/*.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**/*.sh", ".github/workflows/shellcheck.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax (bash -n)
        run: for f in main-vpn-manager.sh scripts/*.sh tools/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        env:
          # Same exclusions as remote-launcher: sourced config (SC1091), `local x=$(…)` (SC2155),
          # a literal ~ in prompts (SC2088), variables used by sourced scripts (SC2034).
          SHELLCHECK_OPTS: -e SC1091 -e SC2155 -e SC2088 -e SC2034
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S warning main-vpn-manager.sh scripts/*.sh tools/*.sh
