# SonarCloud (workflow: .github/workflows/sonar.yml)
sonar.organization=foxfollow
sonar.projectKey=foxfollow_stone-vpn-managment
sonar.projectName=StoneVPN Management
sonar.sourceEncoding=UTF-8

sonar.sources=app/StoneVPNManager,app/Packages/StoneVPNKit/Sources,main-vpn-manager.sh,scripts,tools,docs
sonar.tests=app/Packages/StoneVPNKit/Tests
sonar.exclusions=**/build/**,**/.build/**,**/*.png,**/*.xcstrings,**/*.pbxproj,docs/resources/screens/**

# Coverage comes from the StoneVPNKit unit tests (parsers, Cisco driver, guards). Not unit-testable
# and excluded: the SwiftUI app and root helper, the live-system layer (SCDynamicStore, privileged
# actions, status reader), the bash toolkit and the website.
sonar.coverageReportPaths=sonar-coverage.xml
sonar.coverage.exclusions=app/StoneVPNManager/**,\
  app/Packages/StoneVPNKit/Sources/StoneVPNCore/System/**,\
  app/Packages/StoneVPNKit/Sources/StoneVPNCore/Actions/Actions.swift,\
  main-vpn-manager.sh,scripts/**,tools/**,docs/**
